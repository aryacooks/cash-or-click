<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cash or click? · Design references</title><style>*{box-sizing:border-box}body{margin:0;background:#080a09;color:#f1ead6;font:14px Arial;overflow:hidden}header{height:55px;display:flex;align-items:center;padding:10px 24px;gap:20px}header a{color:#d5662c}button{background:none;border:1px solid #777;color:inherit;padding:8px 16px;cursor:pointer}main{height:calc(100dvh - 55px);display:grid;place-items:center}img{width:100%;height:100%;object-fit:contain}.last{margin-left:auto}</style><header><b>Cash or click? / Image-generated design references</b><a href="../">Open live JavaScript deck</a><span class="last" id="count"></span><button id="prev">← Previous</button><button id="next">Next →</button></header><main><img id="reference" alt="Slide design reference"></main><script>let n=+(location.hash.slice(1)||1);function show(){document.querySelector('img').src='slide-'+String(n).padStart(2,'0')+'.png';document.querySelector('img').alt='Slide '+n+' image-generated design reference';document.querySelector('#count').textContent=n+' / 20';history.replaceState(null,'','#'+n)}document.querySelector('#prev').onclick=()=>{n=Math.max(1,n-1);show()};document.querySelector('#next').onclick=()=>{n=Math.min(20,n+1);show()};addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.querySelector('#next').click();if(e.key==='ArrowLeft')document.querySelector('#prev').click()});show()</script></html>
