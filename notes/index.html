<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Slide-by-slide presentation script for Cash or click?">
<title>Script · Cash or click?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EAD6;--fg:#242a27;--muted:#696d63;--line:#cec8b5;--cod:#d5662c;--pre:#247c70;--card:rgba(255,250,240,.55);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080a09;--fg:#f1ead6;--muted:#a2aaa0;--line:#353c35;--cod:#ed8c50;--pre:#62b7a4;--card:rgba(241,234,214,.03);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#080a09;--fg:#f1ead6;--muted:#a2aaa0;--line:#353c35;--cod:#ed8c50;--pre:#62b7a4;--card:rgba(241,234,214,.03);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Inter Tight',Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:860px;margin:0 auto;padding:48px 16px 80px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:8px;flex-wrap:wrap}
.eyebrow,.num,.go,.print{font:12px 'JetBrains Mono',monospace;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
h1{font-size:44px;letter-spacing:-1.8px;line-height:1.02;margin:10px 0 0}
h1 em,h2 em{font-style:normal;color:var(--cod)}
.actions{display:flex;gap:10px}
a.back,button.print{border:1px solid var(--line);border-radius:20px;padding:8px 14px;color:var(--fg);text-decoration:none;background:transparent;font:500 14px 'Inter Tight',sans-serif;cursor:pointer;text-transform:none;letter-spacing:0}
a.back:hover,button.print:hover{border-color:var(--fg)}
ol{list-style:none;margin:0;padding:0}
.slide{display:grid;grid-template-columns:56px 1fr;gap:4px 18px;padding:24px 0;border-bottom:1px solid var(--line)}
.num{font-size:15px;color:var(--cod);padding-top:5px}
h2{font-size:24px;display:flex;align-items:baseline;flex-wrap:wrap;letter-spacing:-.6px;line-height:1.15;margin:0}
.say{margin:10px 0 0;font-size:19px;line-height:1.6}
.say+.say{margin-top:12px}
.time{font:12px 'JetBrains Mono',monospace;color:var(--muted);margin-left:10px;letter-spacing:.5px}
.total{font:13px 'JetBrains Mono',monospace;color:var(--muted);margin:12px 0 0}
b{font-weight:600}
.go{grid-column:2;margin-top:8px;text-decoration:none;color:var(--pre);font-size:11px;justify-self:start}
.go:hover{text-decoration:underline}
footer{margin-top:28px;font-size:14px;color:var(--muted);line-height:1.5}
@media (max-width:560px){h1{font-size:34px}.slide{grid-template-columns:1fr}.num{padding:0}.go{grid-column:1}.say{font-size:17px}}
@media print{body{background:#fff;color:#000}.actions,.go{display:none}.slide{break-inside:avoid;padding:14px 0}main{padding:0}}
</style>
</head>
<body>
<main>
<header>
  <div><span class="eyebrow">Cash or click? · presentation script</span><h1>The script, <em>slide by slide.</em></h1><p class="total" id="total"></p></div>
  <div class="actions"><a class="back" href="../#globe">← Presentation</a><button class="print" type="button" onclick="print()">Print</button></div>
</header>
<ol id="script"></ol>
<footer>Step-by-step calculations are in the presentation: press <b>N</b> on any slide. Source: amazon_synthetic_1500_orders.xlsx (fully synthetic).</footer>
</main>
<script src="../script.js"></script>
<script>
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
const secs=SCRIPT.reduce((a,s)=>{const [m,x]=s.time.split(':').map(Number);return a+m*60+x},0);
document.getElementById('total').textContent=`${SCRIPT.length} slides · about ${Math.floor(secs/60)} min ${secs%60} s`;
document.getElementById('script').innerHTML=SCRIPT.map((s,i)=>`<li class="slide"><span class="num">${String(i+1).padStart(2,'0')}</span><div><h2>${esc(s.title)}<span class="time">~${s.time}</span></h2>${s.text.map(p=>`<p class="say">${esc(p)}</p>`).join('')}</div><a class="go" href="../#${s.id}">Open slide →</a></li>`).join('');
</script>
</body>
</html>
