const pcr=D.cod.rate/D.pre.rate,excess=sum(D.categories.map(r=>r.excess)),top2=D.categories.slice(0,2),shareN=sum(top2.map(r=>r.cod.n))/D.cod.n,shareX=sum(top2.map(r=>r.excess))/excess;
const keepGap=D.pre.keepSettled-D.cod.keepSettled;
const slides=[
{id:'globe',short:'Cash or click?',title:'Cash or<br><em>click?</em>',dek:'Every parcel has a journey.<br>Every checkout has a choice.',note:'Every day, parcels cross India. At checkout, each customer makes one choice: cash or click. Our question: per ₹100 of orders placed, how much revenue does each payment mode keep after cancellations and returns, and what is the most Amazon can rationally pay to move a COD buyer to Prepaid? This is a course project using fully synthetic Amazon India data.',cover:true},
{id:'cart',short:'The leaky shopping cart',title:'Some orders have<br><em>commitment issues</em>',dek:'Boxes enter the cart. Some have other plans.',stat:pc(D.all.rate),unit:'of orders cancel',explain:`${D.all.cancel} cancellations. One deceptively simple checkout choice.`,mini:'All the revenue is not added.',formula:`Cancellation rate = cancelled ÷ orders · Combined ${D.all.cancel}/${D.all.n} = ${pc(D.all.rate)} · Prepaid ${D.pre.cancel}/${D.pre.n} = ${pc(D.pre.rate)} · COD ${D.cod.cancel}/${D.cod.n} = ${pc(D.cod.rate)}`,call:'<b>Confirm</b> the risky COD orders. The gap is already visible.',note:`Boxes fill the cart, but some bounce out. Combined, ${pc(D.all.rate)} of orders cancel. Prepaid is ${pc(D.pre.rate)}, COD is ${pc(D.cod.rate)}. Not all the revenue is added. The animation cycles through real rows; its counters show only those animated orders.`},
{id:'data',short:'Meet the dataset',title:'1,500 orders. 12 cities.<br><em>One checkout question</em>',dek:'January to September 2025 · Fully synthetic course dataset',stat:num(D.all.n),unit:'orders in the story',explain:`${D.cities.length} cities. ${Math.min(...D.cities.map(c=>c.n))}–${Math.max(...D.cities.map(c=>c.n))} orders each.`,mini:'Balanced coverage does not establish national representativeness.',formula:`n = Σ city counts = ${num(D.all.n)} · ${D.cities.length} cities · ${D.rows[0]?'01 Jan–30 Sep 2025':''} · Source: ${D.source}`,call:'<b>Test</b> the idea in a pilot. These are synthetic orders, not observed Amazon performance.',note:'Our course dataset has 1,500 orders across 12 cities, Jan to Sep 2025, about 125 per city. No single city dominates the sample. Because the workbook is synthetic, this is an analytical demonstration, not evidence of actual Amazon customer behaviour.'},
{id:'lanes',short:'Six methods, two lanes',title:'Six ways to pay.<br><em>Two lanes to compare</em>',dek:'One group pays on arrival. The other has already clicked.',stat:num(D.pre.n),unit:'prepaid orders',explain:`COD has ${D.cod.n} orders. The five Prepaid methods have similar cancellation rates.`,mini:`Prepaid heterogeneity χ² test: p = ${f(D.mergeP,2)}. Similarity is not proof of equivalence.`,formula:`COD n = ${D.cod.n} · Prepaid n = ${D.methods.slice(1).map(g=>g.n).join(' + ')} = ${num(D.pre.n)} · χ²(4), p = ${f(D.mergeP,3)}`,call:'<b>Nudge</b> across payment lanes; the pooled Prepaid group is reasonable for this analysis.',note:`Six payment methods become two lanes: COD (${D.cod.n}) and Prepaid (${num(D.pre.n)}). The Prepaid methods cancel at similar rates (p = ${f(D.mergeP,2)}), so pooling them is reasonable. The test does not prove they are identical.`},
{id:'hist',short:'Distribution & z-score',title:'A thousand little orders.<br><em>A few very big baskets</em>',dek:'One dot = one order. Follow the dots from frequency to percentile.',stat:'421',unit:'orders in ₹500–1,000',explain:'The tallest class. Most baskets are small; a few stretch the tail.',mini:'The last class contains all values of ₹5,000 and above.',formula:'',call:`<b>Confirm</b> high-value COD first: above ${money(D.threshold)} cancels ${pc(D.highRate)}, versus ${pc(D.lowRate)} below.`,note:`The tallest class is ₹500–1,000 with ${D.hist[1]} orders. A ₹1,500 order has z = ${f((1500-D.all.mean)/D.all.sd)} and is larger than ${pc(D.rows.filter(r=>r.value<1500).length/D.all.n,0)} of orders. COD orders above ${money(D.threshold)} cancel ${pc(D.highRate)} of the time, against ${pc(D.lowRate)} at or below it. This high-value threshold is descriptive and needs prospective testing.`},
{id:'tend',short:'Central tendency',title:'The mean has<br><em>expensive friends</em>',dek:'A few large baskets pull the average away from a typical checkout.',stat:money(D.all.median),unit:'the median order',explain:`Mean ${money(D.all.mean)}. The gap is ${money(D.all.mean-D.all.median)}.`,mini:`Pearson median skewness = ${f(D.skew)}. The order-value distribution is right-skewed.`,formula:`x̄ = ${money(D.all.total,2)} ÷ ${num(D.all.n)} = ${money(D.all.mean,2)} · median = ${money(D.all.median,2)} · 3(x̄ − median)/s = ${f(D.skew)}`,call:'<b>Leave COD alone</b> on basket size alone. Quote the median for a typical order.',note:`The median is ${money(D.all.median)} but the mean is ${money(D.all.mean)}. A few big baskets pull the mean up (Pearson skew ${f(D.skew)}), so quote the median when describing a typical order.`},
{id:'disp',short:'Dispersion',title:'Different payment.<br><em>Almost the same spread</em>',dek:'Solid capsule: mean ± 1 SD. Pale capsule: mean ± 2 SD.',stat:'~'+money((D.cod.sd+D.pre.sd)/2),unit:'standard deviation',explain:'The bands overlap heavily. Both lanes include small and big baskets.',mini:'Negative capsule limits are mathematical bounds, not negative order values.',formula:`s = √[Σ(x − x̄)²/(n − 1)] · COD s = ${money(D.cod.sd,2)} · Prepaid s = ${money(D.pre.sd,2)} · CV = s/x̄`,call:'<b>Leave COD alone</b> on spread alone. Similar spreads do not establish the cause of the cancellation gap.',note:`COD and Prepaid orders have similar spread: SD ${money(D.cod.sd)} vs ${money(D.pre.sd)}. This does not by itself rule out basket-size confounding, so we also compare means and adjust for value later.`},
{id:'corr',short:'Correlation',title:'A small correlation.<br><em>A noticeable rate gap</em>',dek:'Bar width = order share. Bar height = cancellation rate.',stat:f(D.corr[0][1]**2*100,1)+'%',unit:'of variance explained',explain:'A weak correlation can coexist with a commercially relevant difference in rates.',mini:'Association does not establish that payment choice causes cancellation.',formula:`r(COD, Cancelled) = ${f(D.corr[0][1],3)} · r² = ${f(D.corr[0][1]**2*100,1)}% · Δ cancellation = ${f((D.cod.rate-D.pre.rate)*100,1)} percentage points`,call:'<b>Test</b> the payment nudge. Statistical association gives a hypothesis, not a guaranteed lift.',note:`Payment mode and cancelling have r = ${f(D.corr[0][1])}, which explains ${f(D.corr[0][1]**2*100,1)}% of the binary-outcome variance. The absolute rate gap is ${f((D.cod.rate-D.pre.rate)*100,1)} percentage points. Rare outcomes can have modest correlations even with substantial relative rate differences.`},
{id:'bayes',short:'Bayes & conditional probability',title:'31% of the orders.<br><em>56% of the cancellations</em>',dek:'Change the denominator. Watch the same orders tell a different story.',stat:pc(D.cod.n/D.all.n,1),unit:'of all orders are COD',explain:'The same 1,500 rows. First filter COD, then look only at cancellations.',mini:'Orange = COD · Teal = Prepaid · red highlights COD cancellations in the COD view.',formula:`P(COD | Cancelled) = (${D.cod.cancel}/${D.cod.n}) × (${D.cod.n}/${D.all.n}) ÷ (${D.all.cancel}/${D.all.n}) = ${pc(D.cod.cancel/D.all.cancel)}`,call:'<b>Confirm</b> selectively in COD, where cancellations are disproportionately concentrated.',note:`COD is ${pc(D.cod.n/D.all.n,0)} of orders but ${pc(D.cod.cancel/D.all.cancel,0)} of cancellations. Bayes changes the question from the chance of cancellation given COD to the chance of COD given a cancellation.`},
{id:'bin',short:'Binomial distribution',title:'One hundred parcels.<br><em>How many plot twists?</em>',dek:'Two binomial distributions, using the observed cancellation rates.',stat:pc(D.binCOD),unit:'COD: P(X ≥ 15)',explain:`For Prepaid, it is ${pc(D.binPre,2)}. Drag the threshold to compare tail risk.`,mini:'Model assumption: 100 independent orders with a constant cancellation probability.',formula:`X ~ Binomial(100, p) · P(X ≥ k) = Σⱼ₌ₖ¹⁰⁰ C(100,j)pʲ(1−p)¹⁰⁰⁻ʲ · pCOD = ${f(D.cod.rate,4)} · pPrepaid = ${f(D.pre.rate,4)}`,call:'<b>Confirm</b> to reduce the expected cancellation load, then measure actual operational savings.',note:`Out of 100 COD orders, 15 or more cancel ${pc(D.binCOD)} of the time under the binomial model. For Prepaid it is ${pc(D.binPre,2)}. Independence and constant risk are modelling assumptions, not demonstrated properties of the data.`},
{id:'clt',short:'CLT & one-sample t',title:'Skewed orders.<br><em>Well-behaved averages</em>',dek:'Draw random orders from the workbook. Let their averages pile up.',stat:'t = '+f(D.oneT),unit:'against ₹1,500',explain:'The benchmark is a placeholder assumption, not an external business target.',mini:'Sampling with replacement · dashed line = normal theory · larger n smooths the skew.',formula:`t = (${f(D.all.mean,2)} − 1500)/(${f(D.all.sd,2)}/√${D.all.n}) = ${f(D.oneT)} · df = ${D.all.n-1} · μ₀ = ₹1,500 [ASSUMPTION]`,call:'<b>Leave COD alone</b> on this test. It compares the overall mean with an assumed benchmark.',note:`Orders are skewed, but sample averages become more nearly normal as sample size grows. With 1,500 observations, the one-sample t statistic against an assumed ₹1,500 benchmark is ${f(D.oneT)}. Independence and representative sampling still matter; the CLT does not automatically validate every t-test.`},
{id:'welch',short:'Welch t-test',title:'Do COD buyers<br><em>order bigger?</em>',dek:'H₀: μCOD = μPrepaid   ·   H₁: μCOD > μPrepaid   ·   α = 0.05',stat:'p = '+f(D.welchP,3),unit:'one-tailed Welch t',explain:'No statistically significant evidence of a higher mean basket for COD.',mini:`COD ${money(D.cod.mean)} · Prepaid ${money(D.pre.mean)} · observed gap ${money(D.cod.mean-D.pre.mean)}`,formula:`t = (${f(D.cod.mean,2)} − ${f(D.pre.mean,2)})/√(${f(D.cod.variance,0)}/${D.cod.n} + ${f(D.pre.variance,0)}/${D.pre.n}) = ${f(D.welchT)} · df ≈ ${num(D.welchDF)}`,call:'<b>Leave COD alone</b> on mean order value. Failure to reject is not proof that the means are equal.',note:`Do COD buyers order bigger? Welch t = ${f(D.welchT)}, one-tailed p = ${f(D.welchP,3)}. Fail to reject the null at 5%. There is no convincing evidence in this sample that COD buyers order bigger; we have not proven equality.`},
{id:'ztest',short:'Two-proportion z-test',title:'Does COD really<br><em>cancel more?</em>',dek:'H₀: pCOD ≤ pPrepaid   ·   H₁: pCOD > pPrepaid   ·   α = 0.05',stat:'z = '+f(D.z),unit:'far past the 5% cutoff',explain:`${pc(D.cod.rate)} versus ${pc(D.pre.rate)}. A ${f((D.cod.rate-D.pre.rate)*100,1)} percentage-point difference.`,mini:`95% unpooled CI for gap: ${f(D.gapCI[0]*100,1)} to ${f(D.gapCI[1]*100,1)} pp. One-tailed p < 0.001.`,formula:`z = (${f(D.cod.rate,4)} − ${f(D.pre.rate,4)})/√[${f(D.all.rate,3)} × ${f(1-D.all.rate,3)} × (1/${D.cod.n} + 1/${D.pre.n})] = ${f(D.z)}`,call:'<b>Confirm and nudge</b> in a pilot. The synthetic sample gives strong evidence of an association.',note:`Does COD cancel more? z = ${f(D.z)}. Reject the null. The rate gap is unlikely under equal cancellation probabilities in this synthetic sample. This still does not establish a causal effect of switching payment method.`},
{id:'chi',short:'Chi-square & Cramér’s V',title:'Payment and outcome<br><em>are linked</em>',dek:'Four outcomes, not just cancelled or not. Hover the cells for observed and expected counts.',stat:'V = '+f(D.cramers,3),unit:'Cramér’s effect size',explain:`χ² = ${f(D.chi,1)}, df = ${D.chiDF}. p < 0.001.`,mini:`Smallest expected count = ${f(Math.min(...D.expected.flat()),1)}. Expected counts support the χ² approximation.`,formula:`χ² = Σ(O−E)²/E = ${f(D.chi,1)} · df = (2−1)(4−1) = 3 · V = √(${f(D.chi,1)}/${D.all.n}) = ${f(D.cramers,3)}`,call:'<b>Test</b> the full revenue outcome. Cancellations alone leave out returns and unresolved orders.',note:`Order outcome is linked to payment mode: χ² = ${f(D.chi,1)}, Cramér’s V = ${f(D.cramers,3)}. The table includes Delivered, Cancelled, Returned and In Transit. This is a broader outcome test than the binary cancellation z-test.`},
{id:'twist',short:'The returns twist',title:'The plot has<br><em>a return policy</em>',dek:'Prepaid returns more. It still keeps more revenue.',stat:money(keepGap*100,1),unit:'more per ₹100 settled',explain:`Settled: COD ${money(D.cod.keepSettled*100,1)} · Prepaid ${money(D.pre.keepSettled*100,1)}.`,mini:`All placed, delivered so far: ${money(D.cod.keepPlaced*100,1)} vs ${money(D.pre.keepPlaced*100,1)}. ${D.all.outcomes['In Transit']} orders remain in transit.`,formula:`Kept per ₹100 settled = 100 × delivered value/(delivered + returned + cancelled value) · COD ${money(D.cod.keepSettled*100,1)} · Prepaid ${money(D.pre.keepSettled*100,1)}`,call:'<b>Nudge</b> on net kept revenue. State the denominator before quoting the upside.',note:`Among non-cancelled orders, Prepaid returns ${pc(D.pre.returnRate)} versus COD ${pc(D.cod.returnRate)}. On settled orders, revenue kept per ₹100 is ${money(D.cod.keepSettled*100,1)} for COD vs ${money(D.pre.keepSettled*100,1)} for Prepaid. That excludes In Transit. On all placed value, delivered revenue so far is ${money(D.cod.keepPlaced*100,1)} vs ${money(D.pre.keepPlaced*100,1)}, with the in-transit outcome unresolved. COD still keeps less.`},
{id:'conf',short:'Category mix & adjusted odds',title:'Is category mix<br><em>the real culprit?</em>',dek:'Adjust the comparison. The association barely moves.',stat:f(D.logOR)+'×',unit:'adjusted odds of cancelling',explain:'Crude, category-stratified and regression-adjusted estimates tell a similar story.',mini:'Logistic controls: category, order value, quantity. These adjustments do not remove all possible confounding.',formula:`OR = ad/bc = ${f(D.crudeOR)} · MH OR = Σ(aᵢdᵢ/nᵢ)/Σ(bᵢcᵢ/nᵢ) = ${f(D.mhOR)} · logistic OR = exp(${f(D.logCoef,3)}) = ${f(D.logOR)}`,call:'<b>Test</b> targeted nudges. The category adjustment supports the association, not a causal guarantee.',note:`Is it category mix? The crude odds ratio is ${f(D.crudeOR)}, Mantel-Haenszel by category is ${f(D.mhOR)}, and the logistic estimate adjusted for category, value and quantity is ${f(D.logOR)}. The result does not seem explained by these measured variables. Odds are not the same as probabilities.`},
{id:'cat',short:'Where it hurts',title:'Two categories.<br><em>Half the excess</em>',dek:'Excess cancellations = COD orders × (COD rate − Prepaid rate), within category.',stat:pc(shareX,0),unit:'of excess cancellations',explain:`Electronics and Home & Kitchen are ${pc(shareN,0)} of COD orders.`,mini:'This is a descriptive excess over the category-specific Prepaid rate, not an estimated treatment effect.',formula:`Electronics: ${top2[0].cod.n} × (${f(top2[0].cod.rate,4)} − ${f(top2[0].pre.rate,4)}) = ${f(top2[0].excess,1)} · Top two: ${f(sum(top2.map(c=>c.excess)),1)}/${f(excess,1)} = ${pc(shareX,0)}`,call:'<b>Confirm</b> first in Electronics and Home & Kitchen. Learn before widening the policy.',note:`Electronics and Home & Kitchen are ${pc(shareN,0)} of COD orders and ${pc(shareX,0)} of the ${f(excess,1)} excess cancellations relative to category-specific Prepaid rates. They are a sensible place to begin a pilot.`},
{id:'find',short:'Four findings, four owners',title:'Four numbers.<br><em>Four people who act</em>',dek:'A statistical result is useful when someone owns the next move.',formula:'Evidence: two-proportion z · one-tailed Welch t · settled revenue retention · adjusted logistic odds',call:'<b>Confirm. Nudge. Test.</b> Keep the owner, the metric and the denominator together.',note:'Operations owns the cancellation gap. Category managers should not restrict COD based on basket size. Finance owns kept revenue and the incentive ceiling. Analytics owns a randomised test with cancellation, returns and contribution tracked together.'},
{id:'rec',short:'Confirm. Shift. Test.',title:'A nudge, yes.<br><em>A blank cheque, no</em>',dek:'Confirm selectively. Offer a measured incentive. Run a randomised pilot.',stat:'',unit:'',explain:'',mini:'',formula:'Scenario assumes shifted buyers reach observed Prepaid retention; confirmation prevents cancellations proportionally. These are assumptions, not causal estimates.',call:'<b>Test</b> net contribution per order. The ceiling excludes delivery costs, payment fees and policy costs.',note:`Confirm: OTP or a call for COD in Electronics and Home & Kitchen first. Shift: test prepaid cashback or part-payment. At the settled revenue gap, break-even is ${money(D.breakEven)} per shifted buyer on revenue, or ${money(D.breakEven*.15)} at an assumed 15% contribution margin. On all placed value so far, the ceiling is ${money(D.breakEvenPlaced)} or ${money(D.breakEvenPlaced*.15)}. These are scenarios, assuming the observed difference can be achieved by a nudge; use a randomised pilot to estimate that lift.`},
{id:'end',short:'Thank you',title:'Cash, click,<br><em>or questions?</em>',dek:'Thank you.',note:'Thank you. Questions. The boxes are ready for cross-examination.',end:true}
];

const revisedTitles=['Cash or<br><em>click?</em>','Some orders have<br><em>commitment issues</em>','1,500 orders. <em>12 cities.</em>','Six ways to pay. <em>Two lanes to compare.</em>','Small baskets. <em>Long tail.</em>','The mean has <em>expensive friends</em>','Different payment. <em>Similar spread.</em>','Small r. <em>A meaningful gap.</em>','31% of orders. <em>56% of cancellations.</em>','100 parcels. <em>How many plot twists?</em>','Skewed orders. <em>Bell-shaped averages.</em>','Do COD buyers <em>order bigger?</em>','Does COD really <em>cancel more?</em>','Payment and outcome <em>are linked</em>','The plot has <em>a return policy</em>','Is category mix <em>the culprit?</em>','Two categories. <em>Half the excess.</em>','Four numbers. <em>Four owners.</em>','A nudge. <em>Not a blank cheque.</em>','Cash, click,<br><em>or questions?</em>'];
slides.forEach((s,i)=>s.title=revisedTitles[i]);
slides[2].dek='Per ₹100 placed, what does each payment mode keep, and what can a Prepaid nudge rationally cost?';
slides[3].stat='p = '+f(D.mergeP,2);slides[3].unit='five prepaid methods';slides[3].explain='Similar cancellation rates. One reasonable pooled comparison.';
slides[4].dek='1,500 actual order dots. Three ways to read their distribution.';
slides[5].stat=f(D.skew);slides[5].unit='Pearson median skewness';slides[5].explain='A positive coefficient signals the long right tail.';slides[5].mini='The mean uses every rupee; the median finds the middle checkout.';
slides[6].stat='≈';slides[6].unit='variation, side by side';slides[6].explain='Similar variability. Different cancellation rates.';slides[6].mini='Compare variance, IQR and CV in the working or by hovering each capsule.';
slides[8].dek='One dataset. Three denominators. Use the filter to change the question.';
slides[13].stat=f(D.chi,1);slides[13].unit='Pearson chi-square';slides[13].explain='V = '+f(D.cramers,3)+' · df = 3 · p < 0.001';

function aside(s){return `<aside class="aside"><div class="stat ${state.index===18?'pre':''}">${s.stat||''}</div><p class="unit">${s.unit||''}</p><p class="explain">${s.explain||''}</p><div class="aside-rule"></div><p class="mini">${s.mini||''}</p></aside>`}
function markup(s,i){const legend=([3,6,7,8,9,13,14].includes(i))?`<div class="legend"><span style="--dot:var(--cod)">COD</span><span style="--dot:var(--pre)">Prepaid</span></div>`:'';let body='';
if(i===0)return `<section class="slide cover" id="s-${s.id}" aria-hidden="true"><div class="heading"><p class="eyebrow">MBA · BUSINESS STATISTICS</p><h1>${s.title}</h1><p class="dek">${s.dek}</p></div><p class="enter mono"><span>→</span> Press Next to enter India</p><p class="orbit-label">ONE PLANET. TWO PAYMENT LANES.</p></section>`;
if(i===19)return `<section class="slide end" id="s-${s.id}" aria-hidden="true"><div class="heading"><p class="eyebrow">THE CHOICE IS YOURS</p><h1>${s.title}</h1><p class="dek">${s.dek}</p></div><button class="button" id="restart">Run it back ↻</button><p class="orbit-label">THE BOXES REST THEIR CASE.</p></section>`;
if(i===3)body=`<div class="controls"><button class="button primary" id="merge">Merge Prepaid →</button><span class="chart-caption">Five methods. One pooled comparison.</span></div>`;
if(i===4)body=`<div class="controls"><div class="tabbar"><button class="button chosen" data-step="0">01 Histogram</button><button class="button" data-step="1">02 Ogive</button><button class="button" data-step="2">03 Order explorer</button></div><label class="slider-wrap" id="value-control" hidden><input aria-label="Order value" id="value" type="range" min="0" max="${Math.ceil(Math.max(...D.rows.map(r=>r.value))/50)*50}" step="50" value="1500"><output id="value-output">₹1,500</output></label></div>`;
if(i===8)body=`<div class="controls"><button class="button primary" id="bayes-filter">COD only →</button><span class="chart-caption" id="bayes-caption">Each dot is an actual workbook row.</span></div>`;
if(i===9)body=`<div class="controls"><label class="slider-wrap">Cancelled orders <input id="k" aria-label="Cancelled orders k out of 15" type="range" min="0" max="15" value="3"><output id="k-output">k = 3</output></label><span class="chart-caption" id="bin-readout"></span></div>`;
if(i===10)body=`<div class="controls"><label class="slider-wrap">Orders in each average <input id="n" aria-label="CLT sample size" type="range" min="5" max="250" step="5" value="30"><output id="n-output">n = 30</output></label><button class="button" id="resample">Sample again ↻</button><span class="chart-caption" id="sample-count"></span></div>`;
if(i===14)body=`<div class="controls"><div class="tabbar"><button class="button chosen" data-retention="settled">Per ₹100 settled</button><button class="button" data-retention="placed">All placed · delivered so far</button></div><span class="chart-caption">In Transit stays unresolved.</span></div>`;
if(i===17)body=`<div class="findings"><div class="find-row"><div class="figure cod">${f(pcr)}×</div><div class="finding">COD cancellation risk versus Prepaid</div><div class="owner">01 / OPERATIONS</div></div><div class="find-row"><div class="figure pre">p = ${f(D.welchP,3)}</div><div class="finding">No significant evidence COD baskets are bigger</div><div class="owner">02 / CATEGORY MANAGERS</div></div><div class="find-row"><div class="figure pre">+${money(keepGap*100,1)}</div><div class="finding">More kept per ₹100 settled on Prepaid</div><div class="owner">03 / FINANCE</div></div><div class="find-row"><div class="figure pre">${f(D.logOR)}×</div><div class="finding">Adjusted cancellation odds, COD versus Prepaid</div><div class="owner">04 / ANALYTICS</div></div></div>`;
if(i===18)body=`<div class="recommendations">${[['shift','COD buyers shifted',0,50,20,'%'],['cut','Remaining COD cancellations prevented',0,50,25,'%'],['incentive','Incentive per shifted buyer',0,400,20,'₹'],['margin','Contribution margin [ASSUMPTION]',0,50,15,'%']].map(([id,label,min,max,value,unit])=>`<div class="rec-control"><label for="${id}"><span>${label}<small class="assumption">${id==='incentive'?'OFFER TO TEST':'SCENARIO ASSUMPTION'}</small></span><output id="${id}-output">${unit==='₹'?money(value):value+'%'}</output></label><input type="range" id="${id}" aria-label="${label}" min="${min}" max="${max}" value="${value}" step="1"></div>`).join('')}</div><div class="verdict"><div><strong id="net-gain"></strong><p id="scenario-detail"></p></div><div><strong id="incentive-verdict"></strong><p id="ceiling-detail"></p></div></div><label class="basis">Revenue basis <select id="basis" aria-label="Revenue denominator"><option value="settled">Settled orders</option><option value="placed">All orders placed, delivered so far</option></select></label>`;
